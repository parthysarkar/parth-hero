<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parth Sarkar – Look-around hero (test)</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  body{position:relative;font-family:"Helvetica Neue",Arial,sans-serif}
  .stage{position:absolute;left:0;top:0;width:100vw;height:56.25vw;container-type:inline-size;touch-action:pan-y;user-select:none;-webkit-user-select:none}
  .amb{position:absolute;inset:-60px;background:#000 url(bg.jpg) center/cover;filter:blur(40px) brightness(.55);display:none}
  .stage.wide{-webkit-mask-image:linear-gradient(to right,transparent,#000 9%,#000 91%,transparent);mask-image:linear-gradient(to right,transparent,#000 9%,#000 91%,transparent)}
  .bg{position:absolute;inset:0;width:100%;height:100%;display:block}
  canvas{position:absolute;display:block;
    -webkit-mask-image:linear-gradient(to right,transparent,#000 5%,#000 95%,transparent),linear-gradient(to bottom,transparent,#000 4%,#000 96%,transparent);
    -webkit-mask-composite:source-in;
    mask-image:linear-gradient(to right,transparent,#000 5%,#000 95%,transparent),linear-gradient(to bottom,transparent,#000 4%,#000 96%,transparent);
    mask-composite:intersect}
  .logo{position:absolute;width:5.2cqw;transform:translate(-50%,-50%);opacity:0;pointer-events:none;will-change:transform,opacity}
  .chip{width:5.2cqw;height:5.2cqw;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.2);
    box-shadow:0 0 1.6cqw rgba(170,120,255,.25),inset 0 0 .8cqw rgba(255,255,255,.06);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  .chip img{width:56%;height:56%;object-fit:contain}
  .name{position:absolute;top:calc(100% + .55cqw);left:50%;transform:translateX(-50%);white-space:nowrap;
    color:rgba(255,255,255,.85);font-size:max(10px,.95cqw);letter-spacing:.02em}
  .hint{position:absolute;z-index:5;left:50%;bottom:16px;transform:translateX(-50%);color:rgba(255,255,255,.75);
    font-size:13px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.15);
    padding:6px 14px;border-radius:20px;transition:opacity .8s}
</style>
</head>
<body>
<div class="amb" id="amb"></div>
<div class="stage" id="stage">
  <img class="bg" id="bgimg" src="bg.jpg" alt="Parth Sarkar, 3D character at his desk">
  <canvas id="cv"></canvas>
</div>
<div class="hint" id="hint">Move your cursor left and right</div>
<script>
(function(){
  var W=1920,H=1080, CROP=[552,50,1371,997], N=54, CENTER=27;
  var stage=document.getElementById('stage'), cv=document.getElementById('cv'), ctx=cv.getContext('2d');
  var cw=CROP[2]-CROP[0], ch=CROP[3]-CROP[1];
  var allLogos=[], TOPMAX=50;
  function layout(){
    var vw=innerWidth, vh=innerHeight, ar=vw/vh, w, h, x, y;
    var wide=ar>2.3, amb=document.getElementById('amb');
    stage.classList.toggle('wide',wide); amb.style.display=wide?'block':'none';
    if(wide){ h=vh*1.1; w=h*16/9; x=(vw-w)/2; }
    else if(ar>=16/9){ w=vw; h=vw*9/16; x=0; }
    else if(ar>=1.41){ h=vh; w=vh*16/9; x=(vw-w)/2; }
    else { w=vw; h=vw*9/16; x=0; }
    var excess=h-vh;
    if(excess>0) y=-Math.min(excess, TOPMAX/H*h); else y=-excess/2;
    stage.style.width=w+'px'; stage.style.height=h+'px'; stage.style.left=x+'px'; stage.style.top=y+'px';
    var vt=Math.max(0,-y/h*H), vb=Math.min(H,(vh-y)/h*H);
    placeLogos(vt,vb);
    return w;
  }
  function placeLogos(vt,vb){
    if(!allLogos.length) return;
    var Y0=73, Y1=687, A=Math.max(Y0,vt+58), B=Math.min(Y1,vb-95);
    if(B<A+300) B=A+300;
    allLogos.forEach(function(o){
      var y=A+(o.by-Y0)*(B-A)/(Y1-Y0);
      o.el.style.left=(o.bx/W*100)+'%'; o.el.style.top=(y/H*100)+'%';
    });
  }
  var stageW=layout(); window.addEventListener('resize',layout);
  var HI=(stageW*(window.devicePixelRatio||1))>2400, SC=HI?2:1, DIR=HI?'f2/':'f/';
  cv.width=cw*SC; cv.height=ch*SC;
  cv.style.left=(CROP[0]/W*100)+'%'; cv.style.top=(CROP[1]/H*100)+'%';
  cv.style.width=(cw/W*100)+'%'; cv.style.height=(ch/H*100)+'%';

  if(HI) document.getElementById('bgimg').src='bg2.jpg';
  var frames=[], loaded=[];
  for(var i=0;i<N;i++){(function(k){
    var im=new Image(); im.decoding='async';
    im.onload=function(){
      function done(b){ frames[k]=b; loaded[k]=true; if(k===CENTER) draw(CENTER,true); }
      if(window.createImageBitmap){ createImageBitmap(im).then(done,function(){ (im.decode?im.decode():Promise.resolve()).then(function(){done(im);}); }); }
      else { (im.decode?im.decode():Promise.resolve()).then(function(){done(im);},function(){done(im);}); }
    };
    im.src=DIR+String(k).padStart(3,'0')+'.webp'; frames[k]=null;})(i);}

  var HX=962, HY=355;
  var LEFT=[
    ['maya','Maya',470,-33,380],['unreal','Unreal Engine',470,-11,380],['blender','Blender',470,11,380],['zbrush','ZBrush',470,33,380],
    ['substance','Substance Painter',700,-26,380],['photoshop','Photoshop',700,-13,380],['premiere','Premiere Pro',700,0,380],['aftereffects','After Effects',700,13,380],['davinci','DaVinci Resolve',700,26,380]];
  var RIGHT=[['claude','Claude',480,-36],['github','GitHub',480,-12],['windows','Windows',480,12],['apple','macOS',480,36]];
  function makeSet(list,side){
    return list.map(function(it,i){
      var R=it[2], cy=it[4]||HY, a=it[3]*Math.PI/180, x=HX+side*R*Math.cos(a), y=cy+R*Math.sin(a);
      var el=document.createElement('div'); el.className='logo';
      el.innerHTML='<div class="chip"><img alt="" src="logos/'+it[0]+(it[0]==='zbrush'?'.png':'.svg')+'"></div><div class="name">'+it[1]+'</div>';
      stage.appendChild(el);
      var dx=HX-x, dy=HY-y, d=Math.hypot(dx,dy);
      var o={el:el, ux:dx/d, uy:dy/d, bx:x, by:y}; allLogos.push(o); return o;
    });
  }
  var leftSet=makeSet(LEFT,-1), rightSet=makeSet(RIGHT,1);
  layout();

  var cur=CENTER, target=CENTER, shown=-1, lastMove=0, moved=false;
  var canHover=window.matchMedia('(hover: hover)').matches;

  function nearest(k){ if(loaded[k]) return k; var best=-1; for(var s=0;s<N;s++){ if(loaded[s] && (best<0 || Math.abs(s-k)<Math.abs(best-k))) best=s; } return best; }
  function draw(v,force){
    if(!force && Math.abs(v-shown)<0.004) return;
    var k0=Math.floor(v), f=v-k0; if(k0>=N-1){k0=N-1; f=0;}
    var a=nearest(k0); if(a<0) return;
    ctx.globalAlpha=1; ctx.drawImage(frames[a],0,0,cv.width,cv.height);
    if(f>0.02 && loaded[k0+1]){ ctx.globalAlpha=f; ctx.drawImage(frames[k0+1],0,0,cv.width,cv.height); ctx.globalAlpha=1; }
    shown=v;
  }
  function clamp(v){return v<0?0:v>1?1:v}
  function updateLogos(set,amt){
    if(set._last!==undefined && Math.abs(set._last-amt)<0.001) return; set._last=amt;
    var step=0.6/set.length;
    for(var i=0;i<set.length;i++){
      var r=clamp((amt-(0.2+i*step))/0.2), e=r*r*(3-2*r), o=set[i];
      var off=(1-e)*2.2;
      o.el.style.opacity=e.toFixed(3);
      o.el.style.transform='translate(-50%,-50%) translate('+(o.ux*off).toFixed(3)+'cqw,'+(o.uy*off).toFixed(3)+'cqw) scale('+(0.82+0.18*e).toFixed(3)+')';
    }
  }
  function setFromX(nx){
    var dz=0.06, a=Math.abs(nx), t=a<dz?0:Math.min(1,(a-dz)/(0.9-dz));
    t=t*Math.sign(nx);
    target = t<0 ? CENTER + t*CENTER : CENTER + t*(N-1-CENTER);
  }
  function onMove(e){
    var x=e.clientX; if(x==null) return;
    setFromX(x/window.innerWidth*2-1);
    lastMove=performance.now();
    if(!moved){moved=true; var h=document.getElementById('hint'); h.style.opacity='0';}
  }
  window.addEventListener('pointermove',onMove,{passive:true});
  window.addEventListener('pointerdown',onMove,{passive:true});
  document.addEventListener('mouseleave',function(){target=CENTER;});
  window.addEventListener('blur',function(){target=CENTER;});

  function auto(now){
    var T=9000, p=(now%T)/T, v;
    if(p<0.12) v=0; else if(p<0.40) v=-Math.sin((p-0.12)/0.28*Math.PI);
    else if(p<0.52) v=0; else if(p<0.80) v=Math.sin((p-0.52)/0.28*Math.PI); else v=0;
    target = v<0 ? CENTER + v*CENTER : CENTER + v*(N-1-CENTER);
  }

  var last=0;
  function tick(now){
    var dt=last?Math.min(64,now-last):16.7; last=now;
    var idle = now-lastMove > (canHover ? 6000 : 4000);
    if(idle && (moved || !canHover)) auto(now);
    cur += (target-cur)*(1-Math.exp(-dt/110));
    if(Math.abs(target-cur)<0.005) cur=target;
    if(cur<0)cur=0; if(cur>N-1)cur=N-1;
    draw(cur);
    updateLogos(leftSet, cur<CENTER ? (CENTER-cur)/CENTER : 0);
    updateLogos(rightSet, cur>CENTER ? (cur-CENTER)/(N-1-CENTER) : 0);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
